services:
  db:
    image: postgres:16-alpine
    container_name: representei-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: representei
      POSTGRES_PASSWORD: representei
      POSTGRES_DB: representei
    ports:
      - "5433:5432"
    volumes:
      - representei-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U representei"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  representei-pg:
